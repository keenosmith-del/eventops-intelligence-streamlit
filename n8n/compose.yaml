name: eventops-streamlit
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.6
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run configure_local.py first}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:5679/
      GENERIC_TIMEZONE: Africa/Johannesburg
      TZ: Africa/Johannesburg
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: 60
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      EVENTOPS_PROCESSOR_URL: http://host.docker.internal:8766
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - companion_n8n:/home/node/.n8n
      - ./:/workflows:ro
volumes:
  companion_n8n:
