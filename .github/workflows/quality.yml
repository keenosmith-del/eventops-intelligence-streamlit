name: Companion quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      GEMINI_ENABLED: "false"
      FASTEMBED_CACHE_PATH: storage/models
      KNOWLEDGE_ADMIN_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/cache@v4
        with:
          path: storage/models
          key: fastembed-bge-small-v1.5-${{ runner.os }}
      - run: pip install -r requirements.lock.txt
      - run: pip check
      - run: ruff check app.py eventops scripts tests deploy
      - run: python -m compileall -q app.py eventops scripts deploy
      - run: python scripts/build_workflows.py --check
      - run: python scripts/validate_workflows.py
      - run: python scripts/security_audit.py
      - run: python -m deploy.ci_check
      - run: python -m deploy.release_manifest --output release-manifest.json
      - run: pytest -q --junitxml=results.xml
      - run: python scripts/evaluate_rag.py
      - name: Native Streamlit startup
        run: |
          streamlit run app.py --server.port 8501 --browser.gatherUsageStats false > /tmp/streamlit.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-test-evidence
          path: |
            results.xml
            docs/iterations/002/evidence/rag-evaluation.json
            release-manifest.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg RELEASE_REVISION=${{ github.sha }} -t eventops-ci .
      - run: docker run --rm --entrypoint python eventops-ci -c "import streamlit,fastembed,eventops.service; print('Container imports passed')"
      - run: docker run --rm --entrypoint sh eventops-ci -c 'test "$(id -u)" != 0'
      - name: Validate HTTPS gateway configuration without starting it
        run: docker run --rm -e APP_SITE=https://assessment.example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.2-alpine caddy validate --config /etc/caddy/Caddyfile
